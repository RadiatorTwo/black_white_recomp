[package]
name = "black_white_recomp"
version = "0.1.0"
edition = "2024"
description = "Black & White (Lionhead 2001) recompiled to native code with Cranelift"
license = "MIT"

[dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"
miniz_oxide = "0.9.1"
md-5 = "0.11.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
debug = "line-tables-only" # function names in crash reports

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
# assembling test snippets
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info", "code_asm"] }
